name: PyPI Release

# https://help.github.com/en/actions/reference/events-that-trigger-workflows
on:  # Trigger the workflow on push or pull request, but only for the master branch
  push:
    branches: [main, "release/*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # based on https://github.com/pypa/gh-action-pypi-publish
  build-package:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.11

    - name: Install dependencies
      run: >-
        python -m pip install --user --upgrade build

    - name: Build packages
      working-directory: python
      run: |
        python -m build --wheel
        ls -lh dist/

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pypi-packages-${{ github.sha }}
        path: python/dist

  upload-package:
    needs: build-package
    if: startsWith(github.event.ref, 'refs/tags') || github.event_name == 'release'
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: pypi-packages-${{ github.sha }}
        path: dist
        merge-multiple: true
    - run: ls -lh dist/

    - name: Upload to release
      uses: AButler/upload-release-assets@3d6774fae0ed91407dc5ae29d576b166536d1777 # v3.0
      with:
        files: 'dist/*'
        repo-token: ${{ secrets.GITHUB_TOKEN }}

  publish-package:
    needs: build-package
    if: startsWith(github.event.ref, 'refs/tags') || github.event_name == 'release'
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: pypi-packages-${{ github.sha }}
        path: dist
        merge-multiple: true
    - run: ls -lh dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        verbose: true
        # Keep re-runs / already-uploaded files green instead of failing with
        # "400 File already exists".
        skip-existing: true
