# Tags the Go module in go/ when a version tag is pushed or a GitHub Release is published.
# Same trigger pattern as PyPI Release (.github/workflows/release.yaml). Go only versions a
# module in a subdirectory through tags prefixed with that directory, so each release tag gets
# a go/v0.YYYYMMDD.N tag at the same commit. .github/scripts/go_release_tag.py holds the mapping.

name: Go Release

on:
  push:
    branches: [main, "release/*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  go-tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.map.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Test tag mapping
        run: python .github/scripts/test_go_release_tag.py -v

      - name: Map release tag to Go tag
        id: map
        if: startsWith(github.event.ref, 'refs/tags') || github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          GO_TAG=$(python .github/scripts/go_release_tag.py "$RELEASE_TAG")
          if [ -z "$GO_TAG" ]; then
            echo "::notice::No Go tag for ${RELEASE_TAG}: it is not a vYYYY.MM.DD[.postN] release tag."
          else
            echo "${RELEASE_TAG} -> ${GO_TAG}"
          fi
          echo "tag=${GO_TAG}" >> "$GITHUB_OUTPUT"

  push-tag:
    needs: go-tag
    if: (startsWith(github.event.ref, 'refs/tags') || github.event_name == 'release') && needs.go-tag.outputs.tag != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Two runs for the same release, such as a re-run, must not race to create the tag.
    concurrency:
      group: go-release-${{ needs.go-tag.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GO_TAG: ${{ needs.go-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The Go checksum database records the commit a version was first served at, so a Go
      # tag that already exists is never moved: a moved tag breaks that version for everyone.
      - name: Create and push Go tag
        run: |
          set -euo pipefail
          commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")

          # The commit the Go tag points to on GitHub, peeled if annotated; empty if it does not exist.
          remote_commit() {
            git ls-remote origin "refs/tags/${GO_TAG}" "refs/tags/${GO_TAG}^{}" |
              awk -v ref="refs/tags/${GO_TAG}" '$2 == ref { plain = $1 } $2 == ref "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }'
          }

          existing=$(remote_commit)
          if [ -z "$existing" ]; then
            git tag "$GO_TAG" "$commit"
            git push origin "refs/tags/${GO_TAG}" || true
            existing=$(remote_commit)
          fi

          if [ "$existing" = "$commit" ]; then
            echo "${GO_TAG} is at ${commit}, the commit of ${RELEASE_TAG}."
          elif [ -z "$existing" ]; then
            echo "::error::Could not push ${GO_TAG}."
            exit 1
          else
            echo "::error::${GO_TAG} already exists at ${existing}, but ${RELEASE_TAG} is at ${commit}. It will not be moved; resolve this by hand."
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      # Ask the public module proxy for the new version so the first `go get` does not wait for it.
      - name: Warm the Go module proxy
        continue-on-error: true
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          module="github.com/lightning-ai/sdk/go@${GO_TAG#go/}"
          for attempt in 1 2 3 4 5; do
            if go list -m "$module"; then
              exit 0
            fi
            echo "proxy.golang.org does not serve ${module} yet (attempt ${attempt}/5)."
            sleep 20
          done
          echo "::warning::proxy.golang.org did not serve ${module} yet. It fetches the tag on the first request, so this does not block installs."
